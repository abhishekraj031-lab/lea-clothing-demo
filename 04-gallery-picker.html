<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lea Clothing Co. — Choose a Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--typography:#2b2b2b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:#f2f2f2;display:flex;justify-content:center;}
  .device{width:393px;max-width:100vw;background:#fff;min-height:100vh;position:relative;overflow:hidden;}

  .status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:15px;font-weight:600;position:relative;z-index:1;}
  .status-bar .right{display:flex;align-items:center;gap:6px;font-size:13px;}
  .battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:7px;background:#fdd015;border-radius:1px;}

  .top-bar{
    height:48px;display:flex;align-items:center;gap:12px;padding:10px 20px;
    border-bottom:1px solid rgba(43,43,43,0.15);position:relative;z-index:1;
  }
  .top-bar button{background:none;border:none;cursor:pointer;padding:0;}
  .top-bar img{width:24px;height:24px;}
  .top-bar h1{flex:1;text-align:center;margin:0 24px 0 0;font-size:16px;font-weight:600;text-transform:uppercase;color:var(--typography);}

  .prompt{text-align:center;margin-top:36px;position:relative;z-index:1;}
  .prompt h2{margin:0 0 8px;font-size:20px;font-weight:700;text-transform:uppercase;color:var(--typography);}
  .prompt p{margin:0;font-size:16px;text-transform:uppercase;color:var(--typography);}

  .overlay{
    position:absolute;inset:0;background:rgba(27,27,27,0.3);z-index:0;
  }

  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:2;
    border-top-left-radius:20px;border-top-right-radius:20px;overflow:hidden;
    box-shadow:0 -4px 20px rgba(0,0,0,0.15);
    max-height:80vh;display:flex;flex-direction:column;
  }
  .sheet-tabs{
    background:#2b2b2b;display:flex;align-items:center;gap:48px;padding:14px 20px 18px;
  }
  .sheet-tabs img{width:32px;height:32px;flex-shrink:0;}
  .pill-group{display:flex;gap:10px;}
  .pill{
    border-radius:100px;padding:10px 16px;font-size:14px;font-weight:500;color:#fff;
    white-space:nowrap;font-family:'Montserrat',sans-serif;border:none;cursor:pointer;
  }
  .pill.active{background:#474747;}
  .pill:not(.active){background:#2b2b2b;}

  .photo-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:2px;overflow-y:auto;
  }
  .photo-grid button{
    padding:0;border:none;cursor:pointer;aspect-ratio:131/168;overflow:hidden;background:#eee;
  }
  .photo-grid img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
