<title>Lea Clothing Co. — Pick a Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--typography:#2b2b2b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:#f2f2f2;display:flex;justify-content:center;}
  .device{width:393px;max-width:100vw;background:#fff;min-height:100vh;position:relative;}
  .status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:15px;font-weight:600;}
  .status-bar .right{display:flex;align-items:center;gap:6px;font-size:13px;}
  .battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:7px;background:#fdd015;border-radius:1px;}

  .promo-banner{height:40px;display:flex;align-items:center;justify-content:center;padding:0 16px;}
  .promo-banner p{margin:0;font-size:11px;font-weight:700;letter-spacing:0.88px;text-transform:uppercase;text-align:center;}

  .navbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;}
  .navbar img.logo{height:40px;}
  .navbar .icons{display:flex;gap:20px;align-items:center;}
  .navbar img.icon{width:24px;height:24px;cursor:pointer;}
  .navbar button.menu-btn{background:none;border:none;padding:0;cursor:pointer;}

  .heading{text-align:center;padding:16px 20px;margin:0;font-size:14px;font-weight:600;letter-spacing:1.68px;text-transform:uppercase;color:var(--typography);}

  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 32px;}
  .product-card{display:flex;flex-direction:column;gap:8px;}
  .product-card .img-wrap{position:relative;width:100%;height:223px;border-radius:4px;overflow:hidden;background:#eee;}
  .product-card .img-wrap img{width:100%;height:100%;object-fit:cover;}
  .try-me-badge{
    position:absolute;left:12px;bottom:12px;background:#fff;border-radius:100px;
    display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:10px;font-weight:600;
    text-transform:uppercase;color:var(--typography);cursor:pointer;border:none;white-space:nowrap;line-height:1.3;
    font-family:'Montserrat',sans-serif;box-shadow:0 1px 4px rgba(0,0,0,0.1);
  }
  .product-card .img-wrap .try-me-badge img{width:12px;height:12px;flex-shrink:0;display:block;object-fit:contain;}
  .product-info{text-align:center;}
  .product-info .name{font-size:10px;font-weight:500;letter-spacing:0.2px;color:var(--typography);margin:0 0 4px;line-height:1.5;}
  .product-info .price{font-size:10px;font-weight:500;letter-spacing:0.2px;color:var(--typography);margin:0;}
</style>
</head>
