<style>
  :root{--muted-plum:#6c4a6d;--typography:#2b2b2b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:#f2f2f2;display:flex;justify-content:center;}
  .device{width:393px;max-width:100vw;background:#fff;min-height:100vh;position:relative;}
  .status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:15px;font-weight:600;position:relative;z-index:1;}
  .status-bar .right{display:flex;align-items:center;gap:6px;font-size:13px;}
  .battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:7px;background:#fdd015;border-radius:1px;}
  .top-bar{height:48px;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(43,43,43,0.15);position:relative;z-index:1;}
  .top-bar button{background:none;border:none;cursor:pointer;padding:0;}
  .top-bar img{width:24px;height:24px;}
  .top-bar h1{flex:1;text-align:center;margin:0 24px 0 0;font-size:16px;font-weight:600;text-transform:uppercase;color:var(--typography);}

  .photo-wrap{position:relative;width:100%;height:581px;overflow:hidden;}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;}
  .dim{position:absolute;inset:0;background:rgba(27,27,27,0.7);}
  .photo-wrap .spinner{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:32px;height:32px;animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  .copy{text-align:center;padding:44px 27px 0;}
  .copy h2{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--typography);}
  .copy p{margin:0;font-size:12px;color:var(--typography);line-height:1.5;}
  .copy .hint{margin-top:44px;}
</style>
