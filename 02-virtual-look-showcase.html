<style>
  :root{
    --muted-plum:#6c4a6d;
    --pale-pink:#ffe6f6;
    --typography:#2b2b2b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:#f2f2f2;display:flex;justify-content:center;}
  .device{width:393px;max-width:100vw;background:#fff;min-height:100vh;position:relative;}

  .status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:15px;font-weight:600;}
  .status-bar .right{display:flex;align-items:center;gap:6px;font-size:13px;}
  .battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:7px;background:#fdd015;border-radius:1px;}

  .top-bar{
    height:56px;display:flex;align-items:center;gap:12px;padding:10px 20px;
    border-bottom:1px solid rgba(43,43,43,0.15);
  }
  .top-bar button{background:none;border:none;cursor:pointer;padding:0;}
  .top-bar img{width:24px;height:24px;}
  .top-bar h1{flex:1;text-align:center;margin:0 24px 0 0;font-size:16px;font-weight:600;text-transform:uppercase;color:var(--typography);}

  .content{padding:24px 20px 32px;}

  .hero{
    width:100%;height:414px;border-radius:8px;overflow:hidden;background:#eee;margin-bottom:20px;
    position:relative;
  }
  .hero img{
    width:100%;height:100%;object-fit:cover;object-position:top center;
    opacity:0;transition:opacity 0.25s ease;
  }
  .hero img.active{opacity:1;position:relative;}
  .hero img:not(.active){position:absolute;top:0;left:0;}

  .thumbs{display:flex;gap:12px;margin-bottom:32px;}
  .thumb{
    width:114px;height:130px;border-radius:8px;overflow:hidden;cursor:pointer;
    border:2px solid transparent;box-shadow:0 4px 10px 0 rgba(0,0,0,0.15);
    background:none;padding:0;flex-shrink:0;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb.active{border-color:var(--pale-pink);box-shadow:0 4px 10px 0 rgba(0,0,0,0.25);}

  .copy{text-align:center;margin-bottom:32px;}
  .copy h2{
    margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:0.72px;text-transform:uppercase;color:#000;
  }
  .copy p{margin:0;font-size:12px;font-weight:500;color:#000;line-height:1.5;}

  .cta-btn{
    display:block;width:100%;background:var(--muted-plum);color:#fff;border:none;border-radius:6px;
    height:44px;line-height:44px;font-size:14px;font-weight:500;letter-spacing:1.68px;text-transform:uppercase;
    cursor:pointer;font-family:'Montserrat',sans-serif;text-align:center;padding:0;
  }
  .cta-btn:active{opacity:0.85;}
</style>

<script>
const totalLooks = 3;
let currentLook = 0;
let autoplayTimer = null;
const AUTOPLAY_DELAY = 1200;

function selectLook(index, isAuto){
  currentLook = index;
  document.querySelectorAll('.hero img').forEach(img => {
    img.classList.toggle('active', img.dataset.look == index);
  });
  document.querySelectorAll('.thumb').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.look == index);
  });
  if(!isAuto){
    restartAutoplay();
  }
}

function advanceLook(){
  const next = (currentLook + 1) % totalLooks;
  selectLook(next, true);
}

function restartAutoplay(){
  if(autoplayTimer) clearInterval(autoplayTimer);
  autoplayTimer = setInterval(advanceLook, AUTOPLAY_DELAY);
}

window.selectLook = selectLook;
restartAutoplay();
</script>
