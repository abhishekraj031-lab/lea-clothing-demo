<style>
  :root{--muted-plum:#6c4a6d;--typography:#2b2b2b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:#f2f2f2;display:flex;justify-content:center;}
  .device{width:393px;max-width:100vw;background:#fff;min-height:100vh;position:relative;}
  .status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:15px;font-weight:600;}
  .status-bar .right{display:flex;align-items:center;gap:6px;font-size:13px;}
  .battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;}
  .battery::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:7px;background:#fdd015;border-radius:1px;}

  .top-bar{height:48px;display:flex;align-items:center;gap:12px;padding:10px 16px;}
  .top-bar button{background:none;border:none;cursor:pointer;padding:0;}
  .top-bar img{width:24px;height:24px;}
  .top-bar h1{flex:1;text-align:center;margin:0 24px 0 0;font-size:16px;font-weight:600;text-transform:uppercase;color:var(--typography);}

  .style-card{
    margin:16px;padding:12px;border:1px solid #ededed;border-radius:8px;box-shadow:0 4px 4px rgba(0,0,0,0.08);
    display:flex;align-items:center;gap:16px;
  }
  .style-card .avatar{
    width:64px;height:64px;border-radius:50%;border:1px solid var(--muted-plum);padding:3px;flex-shrink:0;
  }
  .style-card .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;}
  .style-card .info p{margin:0;}
  .style-card .title{font-size:14px;font-weight:600;color:var(--typography);}
  .style-card .subtitle{font-size:12px;color:var(--typography);margin-top:2px;}
  .style-card .credits-row{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;font-weight:600;color:var(--muted-plum);}
  .style-card .credits-row img{width:12px;height:12px;}
  .style-card .edit-style{
    margin-top:9px;font-size:12px;font-weight:600;color:var(--muted-plum);cursor:pointer;background:none;border:none;
    padding:0;font-family:'Montserrat',sans-serif;text-decoration:underline;
  }

  .section-label{font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#000;margin:8px 16px;}

  .looks-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 32px;}
  .look-card{position:relative;height:260px;border-radius:8px;overflow:hidden;background:#eee;cursor:pointer;}
  .look-card img{width:100%;height:100%;object-fit:cover;object-position:top;}
  .look-card .delete-btn{
    position:absolute;top:10px;right:10px;width:20px;height:20px;border:none;background:none;padding:0;cursor:pointer;
  }
  .look-card .delete-btn img{width:100%;height:100%;object-fit:contain;}
  .look-card .brand-tag{position:absolute;top:10px;left:10px;font-size:14px;font-weight:700;color:var(--muted-plum);font-family:Georgia,serif;}

  .empty-state{text-align:center;color:rgba(43,43,43,0.6);font-size:13px;padding:40px 20px;}

  /* delete confirmation modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,27,27,0.7);display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:393px;max-width:100vw;background:#fff;border-top-left-radius:12px;border-top-right-radius:12px;overflow:hidden;
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;padding:10px 20px;height:56px;
    border-bottom:1px solid rgba(43,43,43,0.15);
  }
  .modal-header p{margin:0;font-size:20px;font-weight:600;color:var(--typography);}
  .modal-header button{background:none;border:none;cursor:pointer;padding:0;}
  .modal-header img{width:24px;height:24px;}
  .modal-body{padding:20px 16px 40px;}
  .modal-body h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--typography);}
  .modal-body p.sub{margin:0 0 24px;font-size:12px;color:var(--typography);}
  .modal-body button{
    display:block;width:100%;height:44px;border-radius:6px;border:none;font-size:14px;font-weight:600;
    letter-spacing:1.68px;text-transform:uppercase;cursor:pointer;font-family:'Montserrat',sans-serif;margin-bottom:16px;
  }
  .btn-delete-confirm{background:var(--muted-plum);color:#fff;}
  .btn-delete-cancel{background:none;color:var(--typography);margin-bottom:0;}
</style>
</head>

function openDeleteModal(index){
  pendingDeleteIndex = index;
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal(){
  pendingDeleteIndex = null;

}
function confirmDelete(){

    looks.splice(pendingDeleteIndex, 1);

  }
  closeDeleteModal();
}
